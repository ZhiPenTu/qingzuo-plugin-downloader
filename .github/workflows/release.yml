name: Build and release downloader plugin
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      host_run_id:
        description: 'Successful Qingzuo v0.6.21 Release commerce desktop run ID'
        required: true
        type: string
      validation:
        description: 'Fixed-response contracts or signed public market installation'
        type: choice
        default: contracts
        options: [contracts, market]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QINGZUO_HOST_RUN_ID: ${{ inputs.host_run_id || vars.QINGZUO_HOST_RUN_ID }}
      QINGZUO_HOST_VERSION: v0.6.21
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify pinned host and SDK provenance
        run: node scripts/verify-release-inputs.mjs
      - name: Download pinned host release
        run: |
          mkdir -p host
          version="${QINGZUO_HOST_VERSION#v}"
          if [[ "$RUNNER_OS" == macOS ]]; then
            asset="CommerceTools-${version}-mac-arm64.zip"
          else
            asset="CommerceTools-${version}-win-x64.exe"
          fi
          curl --fail --location --retry 3 --output "host/$asset" "https://github.com/ZhiPenTu/qingzuo-desktop/releases/download/$QINGZUO_HOST_VERSION/$asset"
      - name: Prepare macOS host outside the plugin source directory
        if: runner.os == 'macOS'
        run: |
          archive=$(find host -maxdepth 1 -name 'CommerceTools-*-mac-arm64.zip' -print -quit)
          test -n "$archive"
          ditto -x -k "$archive" "$RUNNER_TEMP/qingzuo-runtime"
          test -x "$RUNNER_TEMP/qingzuo-runtime/Qingzuo.app/Contents/MacOS/Qingzuo"
          echo "QINGZUO_HOST_EXECUTABLE=$RUNNER_TEMP/qingzuo-runtime/Qingzuo.app/Contents/MacOS/Qingzuo" >> "$GITHUB_ENV"
      - name: Install Windows host outside the plugin source directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem host -Filter 'CommerceTools-*-win-x64.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Pinned Windows installer not found.' }
          $destination = Join-Path $env:RUNNER_TEMP 'qingzuo-runtime'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S','/currentuser',"/D=$destination" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed with exit code $($process.ExitCode)." }
          $executable = Join-Path $destination 'Qingzuo.exe'
          if (-not (Test-Path $executable)) { throw 'Installed Qingzuo.exe not found.' }
          "QINGZUO_HOST_EXECUTABLE=$executable" >> $env:GITHUB_ENV
      - name: Build and verify plugin
        run: |
          npm ci --ignore-scripts
          npm test
          npm run pack
          if [[ "${{ inputs.validation }}" == market ]]; then npm run test:market; else npm run test:host; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Plugin-${{ runner.os }}
          path: |
            release/*.ecplugin
            release/catalog-*.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Downloader-evidence-${{ runner.os }}
          path: output/
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: Plugin-*
          path: release
          merge-multiple: true
      - name: Publish independently validated artifacts
        run: |
          node --input-type=module -e "import pkg from './package.json' with {type:'json'};if(process.env.GITHUB_REF_NAME!=='v'+pkg.version)throw new Error('Tag mismatch');"
          gh release create "$GITHUB_REF_NAME" release/*.ecplugin release/catalog-*.json --verify-tag --title "文件下载器 $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
