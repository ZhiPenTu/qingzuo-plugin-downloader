<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>文件下载器</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <header class="page-head">
      <div>
        <p class="eyebrow">下载任务</p>
        <h1>文件下载器</h1>
        <p class="lede">检测公开下载链接的能力，并在这里查看进度与保存位置。</p>
      </div>
      <button class="icon-button" id="refresh" type="button" aria-label="刷新任务" title="刷新任务">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5"></path><path d="M4 17v-5h5"></path><path d="M6.1 8.1A7 7 0 0 1 18.3 7L20 12"></path><path d="M17.9 15.9A7 7 0 0 1 5.7 17L4 12"></path></svg>
      </button>
    </header>

    <section class="link-panel" aria-labelledby="link-title">
      <form id="probe-form">
        <label id="link-title" class="field-label" for="download-url">下载链接</label>
        <div class="link-row">
          <input id="download-url" name="url" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://example.com/file.zip" aria-describedby="url-hint">
          <button class="button primary" id="probe" type="submit">检测链接</button>
        </div>
        <p class="field-hint" id="url-hint">仅支持公开 HTTPS 直链。需要登录、Cookie 或临时授权的链接无法下载。</p>
      </form>

      <div class="probe-result" id="probe-result" hidden>
        <span class="probe-mark" id="probe-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path></svg>
        </span>
        <div class="probe-copy">
          <div class="probe-title-row">
            <strong id="probe-filename">正在获取文件信息</strong>
            <span class="capability" id="probe-capability"></span>
          </div>
          <p id="probe-detail"></p>
          <p class="probe-meta" id="probe-meta"></p>
        </div>
        <button class="button primary" id="start-download" type="button">开始下载</button>
      </div>
    </section>

    <div class="notice" id="notice" role="status" aria-live="polite" hidden></div>

    <section class="settings-grid" aria-label="下载设置">
      <article class="settings-card">
        <div class="settings-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
        </div>
        <div class="settings-copy">
          <span class="settings-label">默认保存位置</span>
          <strong id="directory-name">正在读取</strong>
          <span class="settings-hint" id="directory-state"></span>
        </div>
        <button class="button secondary compact" id="choose-directory" type="button">更改</button>
      </article>

      <article class="settings-card">
        <div class="settings-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 7h10"></path><path d="M18 7h2"></path><circle cx="16" cy="7" r="2"></circle><path d="M4 17h2"></path><path d="M10 17h10"></path><circle cx="8" cy="17" r="2"></circle></svg>
        </div>
        <div class="settings-copy">
          <span class="settings-label">下载连接数</span>
          <div class="segmented" id="concurrency" role="group" aria-label="下载连接数">
            <button type="button" data-concurrency="1">1</button>
            <button type="button" data-concurrency="2">2</button>
            <button type="button" data-concurrency="3">3</button>
            <button type="button" data-concurrency="4">4</button>
          </div>
          <span class="settings-hint">支持分段时最多使用 4 路连接</span>
        </div>
      </article>
    </section>

    <section class="tasks-section" aria-labelledby="tasks-title">
      <div class="section-head">
        <div>
          <h2 id="tasks-title">全部任务</h2>
          <p id="task-count">暂无任务</p>
        </div>
        <span class="live-indicator" id="live-indicator" hidden>正在更新</span>
      </div>
      <div class="task-error" id="task-error" role="alert" hidden></div>
      <ol class="task-list" id="task-list"></ol>
      <div class="empty-state" id="tasks-empty">
        <span class="empty-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path></svg>
        </span>
        <strong>还没有下载任务</strong>
        <p>粘贴链接后先检测能力，再开始下载。</p>
      </div>
    </section>
  </main>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
